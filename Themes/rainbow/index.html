<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Fredoka';
    src: url('fonts/fredoka.woff2') format('woff2');
    font-weight: 300 700; /* variable font */
    font-display: block;
  }
  @font-face {
    font-family: 'Quicksand';
    src: url('fonts/quicksand.woff2') format('woff2');
    font-weight: 300 700; /* variable font */
    font-display: block;
  }

  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: 'Quicksand', sans-serif; color: #e8e6f0; }

  /* animated rainbow ring around the whole card */
  #ring {
    height: 100%; box-sizing: border-box; padding: 3px; border-radius: 18px;
    background: conic-gradient(from var(--angle),
      #ff004c, #ff8a00, #ffee00, #33cc55, #00c8ff, #7a5cff, #ff4fd8, #ff004c);
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { --angle: 360deg; } }

  #card {
    display: flex; flex-direction: column; height: 100%; box-sizing: border-box;
    padding: 12px 16px 10px; background: rgba(18, 16, 24, 0.96); border-radius: 15px;
  }

  #header { flex: none; text-align: center; padding-bottom: 10px; }
  #header .title {
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 3px;
    background: linear-gradient(90deg, #ff004c, #ff8a00, #ffee00, #33cc55, #00c8ff, #7a5cff, #ff4fd8, #ff004c);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: slide 6s linear infinite;
  }
  @keyframes slide { to { background-position: 300% 0; } }

  #mid { display: flex; flex: 1; min-height: 0; gap: 14px; }

  #list { flex: 1; overflow-y: auto; padding: 2px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 10px;
         margin-bottom: 3px; border-radius: 10px; cursor: default;
         border-left: 4px solid var(--hue, #555); background: rgba(255, 255, 255, 0.04); }
  .row img { flex: none; width: 26px; height: 26px; }
  .row .texts { min-width: 0; flex: 1; }
  .row .app { font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 14px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .title { font-size: 11px; color: #9a94b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.sel {
    border-left-color: #fff;
    background: linear-gradient(90deg, #ff004c, #ff8a00, #ffee00, #33cc55, #00c8ff, #7a5cff);
    background-size: 300% 100%;
    animation: slide 6s linear infinite;
  }
  .row.sel .app, .row.sel .title { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5); }
  .row.min { opacity: 0.5; }

  #frame { flex: none; width: 460px; align-self: center; padding: 3px; border-radius: 13px;
           background: conic-gradient(from var(--angle),
             #ff004c, #ff8a00, #ffee00, #33cc55, #00c8ff, #7a5cff, #ff4fd8, #ff004c);
           animation: spin 8s linear infinite; }
  #frame .inner { background: #16141e; border-radius: 10px; padding: 8px;
                  display: flex; align-items: center; justify-content: center; }
  #frame img { max-width: 100%; max-height: 500px; border-radius: 6px; }

  #footer { flex: none; text-align: center; padding-top: 8px; font-size: 10px;
            color: #9a94b0; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="ring">
  <div id="card">
    <div id="header"><div class="title">S O M E W H E R E</div></div>
    <div id="mid">
      <div id="list"></div>
      <div id="frame"><div class="inner"><img id="shot" alt=""></div></div>
    </div>
    <div id="footer">over the windows 🌈</div>
  </div>
</div>
<script>
  var list = document.getElementById('list');
  var shot = document.getElementById('shot');

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render(state) {
    var html = '';
    state.windows.forEach(function (w, i) {
      // Golden-angle hue distribution: the list itself becomes the rainbow.
      var hue = Math.round((i * 137.508) % 360);
      html += '<div class="row' + (w.selected ? ' sel' : '') + (w.isMinimized ? ' min' : '')
        + '" data-i="' + i + '" style="--hue: hsl(' + hue + ', 85%, 62%)">'
        + '<img src="' + w.iconUrl + '" alt="">'
        + '<span class="texts">'
        + '<div class="app">' + esc(w.appName) + '</div>'
        + (w.title ? '<div class="title">' + esc(w.title) + '</div>' : '')
        + '</span></div>';
    });
    list.innerHTML = html;
    Array.prototype.forEach.call(list.children, function (row) {
      row.addEventListener('click', function () {
        window.alter.confirm(parseInt(row.dataset.i, 10));
      });
    });
    var sel = list.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });

    var w = state.windows[state.selectedIndex];
    shot.onerror = function () { shot.onerror = null; if (w) shot.src = w.iconUrl; };
    if (w && state.previewsEnabled && !w.isMinimized) { shot.src = w.shotUrl; }
    else if (w) { shot.src = w.iconUrl; }
  }

  window.alter.onUpdate(render);
</script>
</body>
</html>
