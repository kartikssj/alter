<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Cinzel';
    src: url('fonts/cinzel-700.woff2') format('woff2');
    font-weight: 700; font-display: block;
  }
  @font-face {
    font-family: 'IM Fell English';
    src: url('fonts/im-fell-english-400.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'IM Fell English';
    src: url('fonts/im-fell-english-400-italic.woff2') format('woff2');
    font-weight: 400; font-style: italic; font-display: block;
  }

  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: 'IM Fell English', serif; color: #3b2f2f; }

  #scroll {
    display: flex; flex-direction: column; height: 100%; box-sizing: border-box;
    padding: 16px 20px;
    background-color: #f1e5c3;
    background-image: url('texture.svg');
    border: 3px solid #7a5c2e;
    outline: 1px solid #d4af37;
    outline-offset: -7px;
    box-shadow: inset 0 0 50px rgba(122, 92, 46, 0.45), 0 10px 40px rgba(0, 0, 0, 0.55);
    border-radius: 4px;
  }

  #header { flex: none; text-align: center; padding-bottom: 10px;
            border-bottom: 1px solid rgba(122, 92, 46, 0.5); margin-bottom: 10px; }
  #header h1 { font-family: 'Cinzel', serif; font-weight: 700; font-size: 17px;
               margin: 0; color: #5a3d1e; letter-spacing: 1px; }
  #header h1 .orn { color: #8b1e1e; }

  #mid { display: flex; flex: 1; min-height: 0; gap: 16px; }

  #list { flex: 1; overflow-y: auto; padding: 2px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 10px;
         border: 1px solid transparent; cursor: default; }
  .row .bullet { flex: none; color: #7a5c2e; font-size: 15px; width: 16px; text-align: center; }
  .row img { flex: none; width: 30px; height: 30px; padding: 2px;
             border: 2px ridge #d4af37; background: #e9dab4;
             filter: sepia(0.25); }
  .row .texts { min-width: 0; }
  .row .app { font-family: 'Cinzel', serif; font-weight: 700; font-size: 14px;
              color: #4a2f18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .title { font-style: italic; font-size: 13px; color: #6b543a;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.sel { background: linear-gradient(to bottom, #a12525, #7c1a1a);
             border-color: #d4af37; border-radius: 3px;
             box-shadow: 0 2px 8px rgba(60, 20, 10, 0.5); }
  .row.sel .bullet { color: #d4af37; }
  .row.sel .app { color: #f7e9c8; }
  .row.sel .title { color: #e3cf9f; }
  .row.min { opacity: 0.6; }

  /* preview = framed painting */
  #frame { flex: none; width: 470px; align-self: center;
           padding: 10px; background: #e9dab4;
           border: 3px ridge #d4af37; outline: 1px solid #7a5c2e;
           box-shadow: 0 6px 20px rgba(60, 40, 10, 0.45);
           display: flex; align-items: center; justify-content: center; }
  #frame img { max-width: 100%; max-height: 500px; filter: sepia(0.18);
               border: 1px solid #7a5c2e; }

  #footer { flex: none; text-align: center; padding-top: 10px;
            font-style: italic; font-size: 12px; color: #6b543a; }
</style>
</head>
<body>
<div id="scroll">
  <div id="header"><h1><span class="orn">⚜</span> Choose Thy Destination <span class="orn">⚜</span></h1></div>
  <div id="mid">
    <div id="list"></div>
    <div id="frame"><img id="shot" alt=""></div>
  </div>
  <div id="footer">— release thy grasp to journey forth —</div>
</div>
<script>
  var list = document.getElementById('list');
  var shot = document.getElementById('shot');

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render(state) {
    var html = '';
    state.windows.forEach(function (w, i) {
      html += '<div class="row' + (w.selected ? ' sel' : '') + (w.isMinimized ? ' min' : '') + '" data-i="' + i + '">'
        + '<span class="bullet">❧</span>'
        + '<img src="' + w.iconUrl + '" alt="">'
        + '<span class="texts">'
        + '<div class="app">' + esc(w.appName) + '</div>'
        + (w.title ? '<div class="title">' + esc(w.title) + '</div>' : '')
        + '</span></div>';
    });
    list.innerHTML = html;
    Array.prototype.forEach.call(list.children, function (row) {
      row.addEventListener('click', function () {
        window.alter.confirm(parseInt(row.dataset.i, 10));
      });
    });
    var sel = list.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });

    var w = state.windows[state.selectedIndex];
    shot.onerror = function () { shot.onerror = null; if (w) shot.src = w.iconUrl; };
    if (w && state.previewsEnabled && !w.isMinimized) { shot.src = w.shotUrl; }
    else if (w) { shot.src = w.iconUrl; }
  }

  window.alter.onUpdate(render);
</script>
</body>
</html>
