<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Cinzel';
    src: url('fonts/cinzel-700.woff2') format('woff2');
    font-weight: 700; font-display: block;
  }
  @font-face {
    font-family: 'IM Fell English';
    src: url('fonts/im-fell-english-400.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'IM Fell English';
    src: url('fonts/im-fell-english-400-italic.woff2') format('woff2');
    font-weight: 400; font-style: italic; font-display: block;
  }

  html, body { margin: 0; background: transparent; }
  body { width: 600px; font-family: 'IM Fell English', serif; color: #3b2f2f; }

  #scroll {
    display: flex; flex-direction: column; box-sizing: border-box;
    padding: 16px 20px;
    background-color: #f1e5c3;
    background-image: url('texture.svg');
    border: 3px solid #7a5c2e;
    outline: 1px solid #d4af37;
    outline-offset: -7px;
    box-shadow: inset 0 0 50px rgba(122, 92, 46, 0.45), 0 10px 40px rgba(0, 0, 0, 0.55);
    border-radius: 4px;
  }

  #header { flex: none; text-align: center; padding-bottom: 10px;
            border-bottom: 1px solid rgba(122, 92, 46, 0.5); margin-bottom: 10px; }
  #header h1 { font-family: 'Cinzel', serif; font-weight: 700; font-size: 17px;
               margin: 0; color: #5a3d1e; letter-spacing: 1px; }
  #header h1 .orn { color: #8b1e1e; }

  #queryrow { flex: none; display: flex; align-items: center; gap: 10px;
              padding: 2px 6px 10px; }
  #queryrow .sigil { color: #7a5c2e; font-size: 16px; }
  al-search-field { flex: 1; min-width: 0; font-size: 17px; }
  al-search-field::part(placeholder) { color: #a68a5f; font-style: italic; }
  al-search-field::part(caret) { background: #8b1e1e; }

  al-search-list { display: block; max-height: 300px; color: #3b2f2f; --al-icon-size: 30px; }
  al-search-list::part(scroll) { padding: 2px; }
  al-search-list::part(row) { border-radius: 3px; border: 1px solid transparent;
                              padding: 6px 10px; }
  al-search-list::part(row-selected) {
    background: linear-gradient(to bottom, #a12525, #7c1a1a);
    border-color: #d4af37;
    box-shadow: 0 2px 8px rgba(60, 20, 10, 0.5);
  }
  al-search-list::part(name) { font-family: 'Cinzel', serif; font-weight: 700;
                               font-size: 14px; color: #4a2f18; }
  al-search-list::part(row-selected) { color: #f7e9c8; }
  al-search-list::part(subtitle) { font-style: italic; font-size: 13px; color: #6b543a; }
  al-search-list::part(empty) { font-style: italic; color: #6b543a; }
  al-search-list::part(icon) { padding: 2px; border: 2px ridge #d4af37;
                               background: #e9dab4; filter: sepia(0.25);
                               box-sizing: border-box; }

  #footer { flex: none; text-align: center; padding-top: 10px;
            font-style: italic; font-size: 12px; color: #6b543a; }
</style>
</head>
<body>
<div id="scroll">
  <div id="header"><h1><span class="orn">⚜</span> Seek Thy Quarry <span class="orn">⚜</span></h1></div>
  <div id="queryrow">
    <span class="sigil">❧</span>
    <al-search-field placeholder="Speak the name of what thou seekest…"></al-search-field>
  </div>
  <al-search-list empty-text="— the archives hold no such entry —"></al-search-list>
  <div id="footer">— ⏎ to open the way, ⌘⏎ to behold its dwelling —</div>
</div>
<script src="alter-lib://alter-elements.js"></script>
<script>if (window.alter && window.alter.autoResize) window.alter.autoResize();</script>
</body>
</html>
