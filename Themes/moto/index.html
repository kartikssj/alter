<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Audiowide';
    src: url('fonts/audiowide-400.woff2') format('woff2');
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: 'Titillium Web';
    src: url('fonts/titillium-web-400.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Titillium Web';
    src: url('fonts/titillium-web-400-italic.woff2') format('woff2');
    font-weight: 400; font-style: italic; font-display: block;
  }

  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: 'Titillium Web', sans-serif; color: #d8d8d8; }

  #cockpit {
    display: flex; flex-direction: column; height: 100%; box-sizing: border-box;
    padding: 12px 16px 0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 6px),
      #181818;
    border: 1px solid #333;
    border-top: 3px solid #d3202f;
    border-radius: 8px;
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.7);
  }

  #header { flex: none; display: flex; justify-content: space-between; align-items: baseline;
            padding-bottom: 8px; border-bottom: 1px solid #333; margin-bottom: 8px; }
  #header .title { font-family: 'Audiowide', sans-serif; font-size: 15px;
                   text-transform: uppercase; letter-spacing: 2px; color: #f0f0f0;
                   transform: skewX(-6deg); }
  #header .title b { color: #d3202f; font-weight: 400; }
  #header .lap { font-size: 11px; color: #777; letter-spacing: 1px; }

  #mid { display: flex; flex: 1; min-height: 0; gap: 16px; }

  #list { flex: 1; overflow-y: auto; padding: 2px 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 5px 10px;
         margin-bottom: 2px; cursor: default; transform: skewX(-6deg);
         transition: transform 0.08s ease-out, background 0.08s ease-out; }
  .row > * { transform: skewX(6deg); } /* lean the row, not the content */
  .row .pos { flex: none; width: 30px; font-family: 'Audiowide', sans-serif;
              font-size: 11px; color: #666; text-align: right; }
  .row img { flex: none; width: 26px; height: 26px; }
  .row .texts { min-width: 0; flex: 1; }
  .row .app { font-family: 'Audiowide', sans-serif; font-size: 12px;
              text-transform: uppercase; letter-spacing: 1px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .title { font-style: italic; font-size: 12px; color: #888;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.sel { background: linear-gradient(90deg, #d3202f, #a01522 70%, transparent);
             transform: skewX(-6deg) translateX(8px);
             box-shadow: 0 0 16px rgba(211, 32, 47, 0.45); }
  .row.sel .pos, .row.sel .app { color: #fff; }
  .row.sel .title { color: #f2b8bd; }
  .row.min { opacity: 0.5; }

  /* helmet visor preview */
  #visor { flex: none; width: 480px; align-self: center; position: relative;
           padding: 6px; background: #0c0c0c; border: 1px solid #444;
           border-radius: 46% / 10%; overflow: hidden;
           display: flex; align-items: center; justify-content: center;
           box-shadow: 0 0 20px rgba(211, 32, 47, 0.25), inset 0 0 30px rgba(0,0,0,0.8); }
  #visor::after { content: ''; position: absolute; inset: 0; pointer-events: none;
                  background: linear-gradient(165deg, rgba(255,255,255,0.16) 0%, transparent 28%); }
  #visor img { max-width: 100%; max-height: 500px; border-radius: 4px; }

  /* checkered flag strip */
  #strip { flex: none; height: 14px; margin: 10px -16px 0;
           background: repeating-conic-gradient(#e8e8e8 0% 25%, #111 0% 50%);
           background-size: 14px 28px; }
</style>
</head>
<body>
<div id="cockpit">
  <div id="header">
    <span class="title">ALTER<b>GP</b> — GRID</span>
    <span class="lap" id="lap"></span>
  </div>
  <div id="mid">
    <div id="list"></div>
    <div id="visor"><img id="shot" alt=""></div>
  </div>
  <div id="strip"></div>
</div>
<script>
  var list = document.getElementById('list');
  var shot = document.getElementById('shot');
  var lap = document.getElementById('lap');

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function pos(i) { return 'P' + (i + 1); }

  function render(state) {
    var html = '';
    state.windows.forEach(function (w, i) {
      html += '<div class="row' + (w.selected ? ' sel' : '') + (w.isMinimized ? ' min' : '') + '" data-i="' + i + '">'
        + '<span class="pos">' + pos(i) + '</span>'
        + '<img src="' + w.iconUrl + '" alt="">'
        + '<span class="texts">'
        + '<div class="app">' + esc(w.appName) + '</div>'
        + (w.title ? '<div class="title">' + esc(w.title) + '</div>' : '')
        + '</span></div>';
    });
    list.innerHTML = html;
    Array.prototype.forEach.call(list.children, function (row) {
      row.addEventListener('click', function () {
        window.alter.confirm(parseInt(row.dataset.i, 10));
      });
    });
    var sel = list.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });

    lap.textContent = 'LAP 01 · ' + state.windows.length + ' RIDERS';

    var w = state.windows[state.selectedIndex];
    shot.onerror = function () { shot.onerror = null; if (w) shot.src = w.iconUrl; };
    if (w && state.previewsEnabled && !w.isMinimized) { shot.src = w.shotUrl; }
    else if (w) { shot.src = w.iconUrl; }
  }

  window.alter.onUpdate(render);
</script>
</body>
</html>
