<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Zen Maru Gothic';
    src: url('fonts/zen-maru-gothic-400.woff2') format('woff2');
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: 'Zen Maru Gothic';
    src: url('fonts/zen-maru-gothic-700.woff2') format('woff2');
    font-weight: 700; font-display: block;
  }

  html, body { margin: 0; background: transparent; }
  body { width: 580px; font-family: 'Zen Maru Gothic', sans-serif; color: #5c374c; }

  #card {
    position: relative; display: flex; flex-direction: column;
    box-sizing: border-box; padding: 14px 16px 10px;
    background: linear-gradient(160deg, rgba(255, 247, 249, 0.97), rgba(255, 235, 240, 0.97));
    border: 1px solid #f2b8c8;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(214, 120, 150, 0.25);
    overflow: hidden;
  }

  /* falling petals */
  .petal {
    position: absolute; top: -24px; z-index: 1; pointer-events: none;
    width: 14px; height: 11px;
    background: radial-gradient(ellipse at 30% 30%, #ffd9e4, #f5a8bf);
    border-radius: 60% 10% 60% 10%;
    opacity: 0.85;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate3d(0, -24px, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.85; }
    50%  { transform: translate3d(26px, 230px, 0) rotate(190deg); }
    92%  { opacity: 0.85; }
    100% { transform: translate3d(-14px, 500px, 0) rotate(360deg); opacity: 0; }
  }

  #header { flex: none; text-align: center; padding-bottom: 8px; position: relative; z-index: 2; }
  #header .jp { font-size: 17px; font-weight: 700; color: #c4587c; letter-spacing: 4px; }
  #header .en { font-size: 10px; color: #c490a3; letter-spacing: 2px; }

  #queryrow { flex: none; display: flex; align-items: center; gap: 8px;
              padding: 2px 10px 8px; position: relative; z-index: 2; }
  #queryrow .bloom { font-size: 14px; }
  al-search-field { flex: 1; min-width: 0; font-size: 17px; }
  al-search-field::part(placeholder) { color: #d3a9b8; }
  al-search-field::part(caret) { background: #c4587c; }

  al-search-list { display: block; max-height: 280px; position: relative; z-index: 2;
                   color: #5c374c; --al-icon-size: 26px; }
  al-search-list::part(scroll) { padding: 2px; }
  al-search-list::part(row) { border-radius: 12px; margin-bottom: 4px; padding: 6px 10px;
                              background: rgba(255, 255, 255, 0.62);
                              border: 1px solid rgba(242, 184, 200, 0.55); }
  al-search-list::part(row-selected) {
    background: linear-gradient(135deg, #f9c9d8, #f3a9c2);
    border-color: #e88ca8; color: #7c2d4b;
    box-shadow: 0 3px 12px rgba(214, 120, 150, 0.35);
  }
  al-search-list::part(name) { font-weight: 700; font-size: 13px; }
  al-search-list::part(subtitle) { font-size: 11px; color: #a97b8e; }
  al-search-list::part(empty) { color: #c490a3; }

  #footer { flex: none; text-align: center; padding-top: 8px; font-size: 10px;
            color: #c490a3; letter-spacing: 1px; position: relative; z-index: 2; }
</style>
</head>
<body>
<div id="card">
  <span class="petal" style="left: 8%;  animation-duration: 7.5s; animation-delay: 0s;"></span>
  <span class="petal" style="left: 26%; animation-duration: 9s;   animation-delay: 1.8s; width: 11px; height: 9px;"></span>
  <span class="petal" style="left: 47%; animation-duration: 8.2s; animation-delay: 3.4s;"></span>
  <span class="petal" style="left: 66%; animation-duration: 10s;  animation-delay: 0.9s; width: 12px; height: 10px;"></span>
  <span class="petal" style="left: 84%; animation-duration: 8.8s; animation-delay: 2.6s;"></span>
  <div id="header">
    <div class="jp">検索</div>
    <div class="en">— searching —</div>
  </div>
  <div id="queryrow">
    <span class="bloom">🌸</span>
    <al-search-field placeholder="find something lovely…"></al-search-field>
  </div>
  <al-search-list empty-text="nothing in bloom"></al-search-list>
  <div id="footer">⏎ to visit 🌸</div>
</div>
<script src="alter-lib://alter-elements.js"></script>
<script>if (window.alter && window.alter.autoResize) window.alter.autoResize();</script>
</body>
</html>
