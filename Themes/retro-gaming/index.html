<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Press Start 2P';
    src: url('fonts/press-start-2p-400.woff2') format('woff2');
    font-weight: 400;
    font-display: block;
  }

  html, body { margin: 0; height: 100%; background: transparent; }
  body { font: 10px 'Press Start 2P', monospace; color: #33ff33; }

  #crt {
    position: relative; display: flex; flex-direction: column;
    height: 100%; box-sizing: border-box; padding: 18px;
    background: #0a0f0a; /* phosphor black */
    border: 4px solid #2b2b2b;
    box-shadow: inset 0 0 0 4px #000, inset 0 0 60px rgba(0, 0, 0, 0.9);
  }
  /* scanlines */
  #crt::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(to bottom,
      rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.28) 3px, rgba(0, 0, 0, 0.28) 4px);
  }
  /* vignette */
  #crt::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 11;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
  }

  #header { flex: none; text-align: center; padding-bottom: 14px;
            color: #33ff33; font-size: 14px; letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(51, 255, 51, 0.8); }
  #header .coin { color: #ffb000; text-shadow: 0 0 8px rgba(255, 176, 0, 0.8); }

  #mid { display: flex; flex: 1; min-height: 0; gap: 16px; }

  #list { flex: 1; overflow-y: auto; padding: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 6px;
         cursor: default; line-height: 1.5; }
  .row .marker { flex: none; width: 14px; visibility: hidden; color: #ffb000;
                 text-shadow: 0 0 8px rgba(255, 176, 0, 0.9); }
  .row.sel .marker { visibility: visible; }
  .row img { flex: none; width: 26px; height: 26px; image-rendering: pixelated; }
  .row .app { text-shadow: 0 0 6px rgba(51, 255, 51, 0.6); }
  .row .title { color: #1e9e1e; font-size: 8px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .row .texts { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .row.sel { background: rgba(51, 255, 51, 0.10);
             outline: 2px solid rgba(51, 255, 51, 0.55); }
  .row.sel .app { color: #ffb000; text-shadow: 0 0 8px rgba(255, 176, 0, 0.9); }
  .row.sel .title { color: #c98a1e; }
  .row.min { opacity: 0.55; }

  #screen { flex: none; width: 470px; border: 4px ridge #33ff33;
            background: #000; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 14px rgba(51, 255, 51, 0.35); padding: 6px; }
  #screen img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }

  #footer { flex: none; text-align: center; padding-top: 14px; color: #33ff33;
            font-size: 9px; text-shadow: 0 0 6px rgba(51, 255, 51, 0.7); }
  .blink { animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="crt">
  <div id="header">WINDOW SELECT <span class="coin">★</span></div>
  <div id="mid">
    <div id="list"></div>
    <div id="screen"><img id="shot" alt=""></div>
  </div>
  <div id="footer"><span class="blink">PRESS TAB&nbsp;&nbsp;▲▼ MOVE&nbsp;&nbsp;⏎ START</span></div>
</div>
<script>
  var list = document.getElementById('list');
  var shot = document.getElementById('shot');

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render(state) {
    var html = '';
    state.windows.forEach(function (w, i) {
      html += '<div class="row' + (w.selected ? ' sel' : '') + (w.isMinimized ? ' min' : '') + '" data-i="' + i + '">'
        + '<span class="marker">▶</span>'
        + '<img src="' + w.iconUrl + '" alt="">'
        + '<span class="texts">'
        + '<span class="app">' + esc(w.appName.toUpperCase()) + '</span>'
        + (w.title ? '<span class="title">' + esc(w.title.toUpperCase()) + '</span>' : '')
        + '</span></div>';
    });
    list.innerHTML = html;
    Array.prototype.forEach.call(list.children, function (row) {
      row.addEventListener('click', function () {
        window.alter.confirm(parseInt(row.dataset.i, 10));
      });
    });
    var sel = list.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });

    var w = state.windows[state.selectedIndex];
    shot.onerror = function () { shot.onerror = null; if (w) shot.src = w.iconUrl; };
    if (w && state.previewsEnabled && !w.isMinimized) { shot.src = w.shotUrl; }
    else if (w) { shot.src = w.iconUrl; }
  }

  window.alter.onUpdate(render);
</script>
</body>
</html>
