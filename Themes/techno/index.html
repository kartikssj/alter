<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Orbitron';
    src: url('fonts/orbitron-700.woff2') format('woff2');
    font-weight: 700; font-display: block;
  }
  @font-face {
    font-family: 'Rajdhani';
    src: url('fonts/rajdhani-500.woff2') format('woff2');
    font-weight: 500; font-display: block;
  }

  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: 'Rajdhani', sans-serif; color: #b8feff; }

  #hud {
    position: relative; display: flex; flex-direction: column;
    height: 100%; box-sizing: border-box; padding: 14px 18px;
    background:
      linear-gradient(rgba(0, 255, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 255, 0.045) 1px, transparent 1px),
      rgba(5, 5, 16, 0.94);
    background-size: 28px 28px, 28px 28px, auto;
    border: 1px solid rgba(0, 255, 255, 0.5);
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    box-shadow: 0 0 24px rgba(0, 255, 255, 0.25), inset 0 0 40px rgba(0, 255, 255, 0.05);
  }

  /* slow scanline sweep */
  #hud::after {
    content: ''; position: absolute; left: 0; right: 0; height: 60px; z-index: 5;
    background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.07), transparent);
    animation: sweep 4.5s linear infinite; pointer-events: none;
  }
  @keyframes sweep { from { top: -60px; } to { top: 100%; } }

  #header { flex: none; display: flex; justify-content: space-between; align-items: baseline;
            padding-bottom: 10px; border-bottom: 1px solid rgba(0, 255, 255, 0.35);
            margin-bottom: 8px; }
  #header .sys { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 3px;
                 color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); }
  #header .sys b { color: #ff00c8; text-shadow: 0 0 10px rgba(255, 0, 200, 0.8); font-weight: 700; }
  #header .meta { font-size: 12px; letter-spacing: 1px; color: #4d8a8f; }

  #mid { display: flex; flex: 1; min-height: 0; gap: 16px; }

  #list { flex: 1; overflow-y: auto; padding: 2px 4px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 10px;
         border-left: 3px solid transparent; cursor: default;
         transition: transform 0.08s ease-out, background 0.08s ease-out; }
  .row img { flex: none; width: 28px; height: 28px;
             filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.35)); }
  .row .texts { min-width: 0; }
  .row .app { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px;
              letter-spacing: 1.5px; text-transform: uppercase;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .title { font-size: 13px; color: #5ea8ad; letter-spacing: 0.5px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.sel { background: linear-gradient(90deg, rgba(0, 255, 255, 0.14), rgba(0, 255, 255, 0.02) 70%, transparent);
             border-left-color: #00ffff; transform: translateX(6px); }
  .row.sel .app { color: #00ffff; text-shadow: 0 0 8px rgba(0, 255, 255, 0.9); }
  .row.sel .title { color: #8fd9de; }
  .row.min { opacity: 0.45; }
  .row .idx { flex: none; width: 26px; text-align: right; font-size: 11px; color: #2a4a4f; }
  .row.sel .idx { color: #ff00c8; text-shadow: 0 0 6px rgba(255, 0, 200, 0.8); }

  #viewport { flex: none; width: 490px; align-self: center; padding: 8px;
              border: 1px solid rgba(0, 255, 255, 0.6);
              box-shadow: 0 0 16px rgba(0, 255, 255, 0.3), inset 0 0 24px rgba(0, 255, 255, 0.06);
              background: rgba(0, 10, 14, 0.8);
              clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
              display: flex; align-items: center; justify-content: center; }
  #viewport img { max-width: 100%; max-height: 500px;
                  filter: saturate(1.15) contrast(1.05); }

  #footer { flex: none; display: flex; justify-content: space-between; padding-top: 8px;
            border-top: 1px solid rgba(0, 255, 255, 0.2); margin-top: 8px;
            font-size: 11px; letter-spacing: 1px; color: #4d8a8f; }
</style>
</head>
<body>
<div id="hud">
  <div id="header">
    <span class="sys">SYS<b>://</b>WINDOW_SWITCH</span>
    <span class="meta" id="meta"></span>
  </div>
  <div id="mid">
    <div id="list"></div>
    <div id="viewport"><img id="shot" alt=""></div>
  </div>
  <div id="footer"><span>[TAB] CYCLE&nbsp;&nbsp;[⏎] ENGAGE</span><span id="mode"></span></div>
</div>
<script>
  var list = document.getElementById('list');
  var shot = document.getElementById('shot');
  var meta = document.getElementById('meta');
  var mode = document.getElementById('mode');

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function render(state) {
    var html = '';
    state.windows.forEach(function (w, i) {
      html += '<div class="row' + (w.selected ? ' sel' : '') + (w.isMinimized ? ' min' : '') + '" data-i="' + i + '">'
        + '<span class="idx">' + pad(i + 1) + '</span>'
        + '<img src="' + w.iconUrl + '" alt="">'
        + '<span class="texts">'
        + '<div class="app">' + esc(w.appName) + '</div>'
        + (w.title ? '<div class="title">' + esc(w.title) + '</div>' : '')
        + '</span></div>';
    });
    list.innerHTML = html;
    Array.prototype.forEach.call(list.children, function (row) {
      row.addEventListener('click', function () {
        window.alter.confirm(parseInt(row.dataset.i, 10));
      });
    });
    var sel = list.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });

    meta.textContent = pad(state.windows.length) + ' TARGETS';
    mode.textContent = state.mode === 'frontApp' ? 'MODE: APP-LOCK' : 'MODE: GLOBAL';

    var w = state.windows[state.selectedIndex];
    shot.onerror = function () { shot.onerror = null; if (w) shot.src = w.iconUrl; };
    if (w && state.previewsEnabled && !w.isMinimized) { shot.src = w.shotUrl; }
    else if (w) { shot.src = w.iconUrl; }
  }

  window.alter.onUpdate(render);
</script>
</body>
</html>
