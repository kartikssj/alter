<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Baloo 2';
    src: url('fonts/baloo2.woff2') format('woff2');
    font-weight: 400 800; /* variable font */
    font-display: block;
  }

  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: 'Baloo 2', sans-serif; color: #4a3728; }

  /* the card is the cat */
  #cat {
    position: relative; display: flex; flex-direction: column;
    height: 100%; box-sizing: border-box; padding: 20px 16px 10px;
    background: #fff8ee;
    border: 3px solid #f4a259;
    border-radius: 22px;
    box-shadow: 0 12px 36px rgba(244, 162, 89, 0.3);
  }
  /* ears */
  #cat::before, #cat::after {
    content: ''; position: absolute; top: -16px; width: 0; height: 0;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-bottom: 18px solid #f4a259;
  }
  #cat::before { left: 26px; transform: rotate(-12deg); }
  #cat::after  { right: 26px; transform: rotate(12deg); }

  #header { flex: none; text-align: center; padding-bottom: 6px; }
  #header .title { font-size: 17px; font-weight: 700; color: #e07b39; }
  #header .sub { font-size: 11px; color: #b08d6f; }

  #mid { display: flex; flex: 1; min-height: 0; gap: 14px; }

  #list { flex: 1; overflow-y: auto; padding: 2px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 12px;
         margin-bottom: 3px; border-radius: 999px; cursor: default;
         border: 2px solid transparent; }
  .row .paw { flex: none; font-size: 12px; opacity: 0.55; }
  .row img { flex: none; width: 26px; height: 26px; border-radius: 50%;
             border: 2px solid #f0dcc0; background: #fff; }
  .row .texts { min-width: 0; flex: 1; }
  .row .app { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .title { font-size: 11px; color: #a5826a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .face { flex: none; visibility: hidden; font-size: 15px; }
  .row.sel { background: #f4a259; border-color: #e07b39;
             animation: wiggle 0.3s ease-in-out; }
  .row.sel .app, .row.sel .title { color: #fff; }
  .row.sel .paw { opacity: 1; }
  .row.sel .face { visibility: visible; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-0.7deg); }
    75% { transform: rotate(0.7deg); }
  }
  .row.min { opacity: 0.55; }

  #frame { flex: none; width: 230px; align-self: center; position: relative;
           padding: 10px; background: #fff3e0; border: 2px dashed #f4a259;
           border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  #frame::before { content: '🐾'; position: absolute; top: -14px; left: 50%;
                   transform: translateX(-50%); font-size: 16px; background: #fff8ee;
                   padding: 0 6px; }
  #frame img { max-width: 100%; max-height: 310px; border-radius: 10px; }

  #footer { flex: none; text-align: center; padding-top: 8px; font-size: 11px; color: #b08d6f; }
</style>
</head>
<body>
<div id="cat">
  <div id="header">
    <div class="title">Cat Herder</div>
    <div class="sub">pick a window, they're all napping</div>
  </div>
  <div id="mid">
    <div id="list"></div>
    <div id="frame"><img id="shot" alt=""></div>
  </div>
  <div id="footer">=^･ω･^=&ensp; release to adopt</div>
</div>
<script>
  var list = document.getElementById('list');
  var shot = document.getElementById('shot');

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render(state) {
    var html = '';
    state.windows.forEach(function (w, i) {
      html += '<div class="row' + (w.selected ? ' sel' : '') + (w.isMinimized ? ' min' : '') + '" data-i="' + i + '">'
        + '<span class="paw">🐾</span>'
        + '<img src="' + w.iconUrl + '" alt="">'
        + '<span class="texts">'
        + '<div class="app">' + esc(w.appName) + '</div>'
        + (w.title ? '<div class="title">' + esc(w.title) + '</div>' : '')
        + '</span><span class="face">😺</span></div>';
    });
    list.innerHTML = html;
    Array.prototype.forEach.call(list.children, function (row) {
      row.addEventListener('click', function () {
        window.alter.confirm(parseInt(row.dataset.i, 10));
      });
    });
    var sel = list.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });

    var w = state.windows[state.selectedIndex];
    shot.onerror = function () { shot.onerror = null; if (w) shot.src = w.iconUrl; };
    if (w && state.previewsEnabled && !w.isMinimized) { shot.src = w.shotUrl; }
    else if (w) { shot.src = w.iconUrl; }
  }

  window.alter.onUpdate(render);
</script>
</body>
</html>
