<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'EB Garamond';
    src: url('fonts/eb-garamond-400.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'EB Garamond';
    src: url('fonts/eb-garamond-400-italic.woff2') format('woff2');
    font-weight: 400; font-style: italic; font-display: block;
  }
  @font-face {
    font-family: 'Playfair Display';
    src: url('fonts/playfair-display-700.woff2') format('woff2');
    font-weight: 700; font-display: block;
  }

  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: 'EB Garamond', serif; color: #2e2618; }

  /* the open book */
  #book {
    display: flex; height: 100%; box-sizing: border-box; position: relative;
    background-color: #f5efe0;
    background-image: url('texture.svg');
    border-radius: 3px 8px 8px 3px;
    box-shadow: 0 14px 44px rgba(30, 20, 8, 0.55), inset 0 0 40px rgba(120, 95, 50, 0.16);
    border: 1px solid #b8a888;
  }
  /* spine crease */
  #book::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 44px;
    transform: translateX(-50%); pointer-events: none; z-index: 3;
    background: linear-gradient(90deg,
      rgba(60, 45, 20, 0) 0%, rgba(60, 45, 20, 0.22) 46%,
      rgba(40, 30, 12, 0.38) 50%, rgba(60, 45, 20, 0.22) 54%, rgba(60, 45, 20, 0) 100%);
  }

  .page { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 18px 22px 12px; }
  .page.left  { box-shadow: inset -18px 0 24px -20px rgba(60, 45, 20, 0.5); }
  .page.right { box-shadow: inset 18px 0 24px -20px rgba(60, 45, 20, 0.5);
                align-items: center; justify-content: center; }

  .chapter { flex: none; text-align: center; font-family: 'Playfair Display', serif;
             font-weight: 700; font-size: 15px; letter-spacing: 2px; color: #5a4526;
             padding-bottom: 8px; border-bottom: 1px solid rgba(90, 69, 38, 0.35); margin-bottom: 10px; }
  .chapter small { display: block; font-family: 'EB Garamond', serif; font-style: italic;
                   font-weight: 400; font-size: 11px; letter-spacing: 0.5px; color: #8a7150; }

  #list { flex: 1; overflow-y: auto; padding-right: 6px; }
  .row { position: relative; display: flex; align-items: center; gap: 10px;
         padding: 5px 16px 5px 8px; cursor: default; }
  .row img { flex: none; width: 24px; height: 24px; filter: sepia(0.3) saturate(0.9); }
  .row .texts { min-width: 0; flex: 1; }
  .row .app { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 14px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .title { font-style: italic; font-size: 13px; color: #6d5a3d;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.sel .app { text-decoration: underline; text-decoration-color: #8b1e1e;
                  text-underline-offset: 3px; }
  /* drop cap on the selected row's initial */
  .row.sel .app::first-letter { font-size: 20px; color: #8b1e1e; }
  /* bookmark ribbon hanging off the selected row */
  .row.sel::after {
    content: ''; position: absolute; right: 4px; top: 0; width: 12px; height: 26px;
    background: #8b1e1e;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
  }
  .row.min { opacity: 0.55; }

  /* right page: the illustration plate */
  .plate { padding: 10px; background: #efe7d2; border: 1px solid #b8a888;
           box-shadow: 0 4px 14px rgba(60, 45, 20, 0.3);
           display: flex; align-items: center; justify-content: center; max-width: 100%; }
  .plate img { max-width: 100%; max-height: 520px; border: 1px solid #9a8464;
               filter: sepia(0.22); }
  .caption { margin-top: 8px; font-style: italic; font-size: 12px; color: #6d5a3d;
             text-align: center; max-width: 320px; }

  .folio { flex: none; text-align: center; padding-top: 8px; font-size: 11px;
           color: #8a7150; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="book">
  <div class="page left">
    <div class="chapter">Chapter I<small>in which the windows are enumerated</small></div>
    <div id="list"></div>
    <div class="folio" id="folio"></div>
  </div>
  <div class="page right">
    <div class="plate"><img id="shot" alt=""></div>
    <div class="caption" id="caption"></div>
  </div>
</div>
<script>
  var list = document.getElementById('list');
  var shot = document.getElementById('shot');
  var folio = document.getElementById('folio');
  var caption = document.getElementById('caption');

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function roman(n) {
    var table = [[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],
                 [50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];
    var out = '';
    table.forEach(function (p) { while (n >= p[0]) { out += p[1]; n -= p[0]; } });
    return out || 'i';
  }

  function render(state) {
    var html = '';
    state.windows.forEach(function (w, i) {
      html += '<div class="row' + (w.selected ? ' sel' : '') + (w.isMinimized ? ' min' : '') + '" data-i="' + i + '">'
        + '<img src="' + w.iconUrl + '" alt="">'
        + '<span class="texts">'
        + '<div class="app">' + esc(w.appName) + '</div>'
        + (w.title ? '<div class="title">' + esc(w.title) + '</div>' : '')
        + '</span></div>';
    });
    list.innerHTML = html;
    Array.prototype.forEach.call(list.children, function (row) {
      row.addEventListener('click', function () {
        window.alter.confirm(parseInt(row.dataset.i, 10));
      });
    });
    var sel = list.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });

    folio.textContent = 'folio ' + roman(state.selectedIndex + 1) + ' of ' + roman(state.windows.length);

    var w = state.windows[state.selectedIndex];
    caption.textContent = w ? 'Fig. ' + roman(state.selectedIndex + 1) + ' — ' + w.appName + ', in repose.' : '';
    shot.onerror = function () { shot.onerror = null; if (w) shot.src = w.iconUrl; };
    if (w && state.previewsEnabled && !w.isMinimized) { shot.src = w.shotUrl; }
    else if (w) { shot.src = w.iconUrl; }
  }

  window.alter.onUpdate(render);
</script>
</body>
</html>
